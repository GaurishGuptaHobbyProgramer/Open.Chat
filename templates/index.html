<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenChat</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="device-{{ device_type }}" data-device-type="{{ device_type }}">
    <div class="app-shell">
        <div class="chat-container">
            <header class="header">
                <div class="brand-wrap">
                    <div class="brand-icon">🌍</div>
                    <div class="brand-copy">
                        <div class="brand-name">OpenChat</div>
                        <div class="brand-tagline">Live community space</div>
                    </div>
                </div>

                <div class="header-controls">
                    <label class="username-panel" for="username-input">
                        <span>Name</span>
                        <input id="username-input" type="text" maxlength="30" placeholder="Your name" />
                    </label>
                    <div id="online-users" class="online-users">🟢 0 online</div>
                    <button id="device-mode-toggle" class="device-mode-toggle" type="button" aria-label="Toggle between desktop and mobile mode">
                        Mobile mode
                    </button>
                    <button id="theme-toggle" class="theme-toggle" aria-pressed="false" title="Toggle theme">
                        <span class="moon">🌙</span>
                        <span class="sun">☀️</span>
                    </button>
                </div>
            </header>

            <main class="chat-main">
                <div class="chat-box" id="chat-box" aria-live="polite"></div>
            </main>

            <form class="input-area" id="message-form">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                <button id="send-button" type="submit">Send</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
