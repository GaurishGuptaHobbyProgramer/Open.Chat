services:
  - type: web
    name: openchat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENCHAT_DEVELOPER_USER_ID
        sync: false
      - key: OPENCHAT_DEVELOPER_OTP_PHONE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
